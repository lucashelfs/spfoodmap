<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Food Map of São Paulo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div id="lang-switcher">
      <button type="button" data-lang="pt">PT</button>
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
    <h1 id="title">World Food Map of São Paulo</h1>
    <p id="subtitle">Click a country to see restaurants in São Paulo serving that cuisine.</p>
  </header>
  <div id="layout">
    <div id="map"></div>
    <aside id="panel">
      <p class="hint">Click a highlighted country on the map.</p>
    </aside>
  </div>

  <script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"
    integrity="sha256-8glLv2FBs1lyLE/kVOtsSw8OQswQzHr5IfwVj864ZTk=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
